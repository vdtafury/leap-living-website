# Automatic checks on every pull request (D-49): nothing is merged unless these pass.
# lint · types · unit tests (vitest) · production build · scripts/verify.sh against the
# running build · browser tests (Playwright: carousel, search, accounts, reviews).
# Everything runs on a throwaway SQLite database inside the runner; no secrets are needed
# and nothing here touches the live site.
name: CI

on:
  pull_request:
  push:
    branches: [main, feat/multi-page-platform]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  checks:
    name: Lint, types, tests, build, verify, browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
      # Throwaway values for a database that only exists in this run.
      DATABASE_URL: file:./storage/ci/site.db
      STORAGE_DIR: ./storage/ci
      ADMIN_USER: ciadmin
      ADMIN_PASSWORD: ci-initial-password-1
    steps:
      # Actions pinned to exact commits (checkout v7.0.1, setup-node v7.1.0, upload-artifact v7.0.2).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate the database client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Start the build
        run: |
          mkdir -p storage/ci
          nohup npx next start -H 127.0.0.1 -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && exit 0
            sleep 1
          done
          cat /tmp/next.log
          exit 1

      - name: Platform verification (scripts/verify.sh)
        run: |
          set +e
          BASE=http://127.0.0.1:3000 bash scripts/verify.sh | tee /tmp/verify.log
          status=${PIPESTATUS[0]}
          # Show each failed check on the pull request page.
          grep '^FAIL' /tmp/verify.log | sed 's/^/::error title=verify.sh::/'
          exit $status

      - name: Install the browser for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Playwright)
        run: npm run test:e2e

      - name: Server log
        if: failure()
        run: cat /tmp/next.log || true

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
